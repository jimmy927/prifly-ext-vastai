# A pull request cannot be merged until every author in it has signed CLA.md,
# the copyright assignment to The Startup Factory AB. The bot comments on the
# PR, the author replies with the sign sentence, and the signature is committed
# to signatures/version1/cla.json on the unprotected `cla-signatures` branch,
# so master's branch protection never has to let the bot through.
#
# pull_request_target runs this workflow from master, never from the PR's own
# code, so a fork cannot change what the check does.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the prifly CLA and I hereby assign my contributions to The Startup Factory AB'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/jimmy927/prifly-ext-vastai/blob/main/CLA.md
          branch: cla-signatures
          allowlist: jimmy927,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the prifly CLA and I hereby assign my contributions to The Startup Factory AB
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Before it can be merged, please read
            the [prifly Contributor License Agreement](https://github.com/jimmy927/prifly-ext-vastai/blob/main/CLA.md),
            which assigns the copyright in your contribution to The Startup Factory AB,
            and sign it by commenting with the sentence below.
